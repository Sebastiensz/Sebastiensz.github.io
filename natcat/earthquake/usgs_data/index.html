<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1">
  <title>Séismes en temps réel — USGS</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/dark/main.css">
  <script src="https://js.arcgis.com/4.30/"></script>
  <style>
    html, body, #viewDiv { padding:0; margin:0; height:100%; width:100%; }

    /* ── Panneaux custom positionnés en absolu ── */
    #panel {
      position: absolute;
      top: 15px;
      left: 60px;
      z-index: 10;
      background: rgba(13,12,20,.92);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      padding: 14px 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e8e0d5;
      min-width: 240px;
      backdrop-filter: blur(8px);
      pointer-events: auto;
    }
    #panel h1 { font-size: 15px; font-weight: 700; color: white; margin: 0 0 2px; }
    #panel .sub { font-size: 11px; color: #7a6f8a; margin-bottom: 12px; }
    .kpis { display: flex; gap: 7px; }
    .kpi { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09); border-radius: 7px; padding: 8px 12px; flex: 1; min-width: 0; }
    .kpi .kv { font-size: 18px; font-weight: 700; color: white; font-family: monospace; line-height: 1; white-space: nowrap; }
    .kpi .kl { font-size: 9px; color: #7a6f8a; text-transform: uppercase; letter-spacing: .5px; margin-top: 3px; white-space: nowrap; }
    .kpi.red    .kv { color: #ef4444; }
    .kpi.orange .kv { color: #f97316; }

    #controls {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 10;
      background: rgba(13,12,20,.92);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 10px;
      padding: 12px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      backdrop-filter: blur(8px);
      min-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: auto;
    }
    .ctrl-label {
      font-size: 10px; color: #7a6f8a; text-transform: uppercase;
      letter-spacing: .6px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center;
    }
    .ctrl-label span { color: white; font-size: 12px; font-family: monospace; font-weight: 700; }

    select.ctrl-select {
      width: 100%; font-size: 12px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.15);
      color: white; padding: 6px 10px; border-radius: 5px; cursor: pointer;
      outline: none;
    }
    select.ctrl-select option { background: #17151f; }

    input[type=range] {
      width: 100%; accent-color: #ef4444; cursor: pointer; margin-top: 3px;
      height: 4px;
    }
    input[type=range]:disabled { opacity: .45; cursor: progress; }

    #source {
      position: absolute;
      bottom: 25px;
      right: 15px;
      z-index: 10;
      background: rgba(13,12,20,.85);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 10px;
      color: #7a6f8a;
      font-family: sans-serif;
      text-align: center;
      pointer-events: auto;
    }
    #source a { color: #d4a017; text-decoration: none; }
    /* ── Navigation entre les trois vues de l'application ── */
    #source .views { margin-bottom: 4px; color: #4d4560; }
    #source .views a { color: #e8e0d5; }
    #source .views a[aria-current="page"] { color: #d4a017; font-weight: 700; }

    /* ── Loading overlay ── */
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: rgba(13,12,20,.93); border-radius: 10px; padding: 18px 28px;
      text-align: center; font-family: sans-serif; color: #e8e0d5; font-size: 13px;
      z-index: 100; pointer-events: none; transition: opacity .4s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }

    /* ── Message d'erreur visible (flux USGS ou carte indisponible) ── */
    #error {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      max-width: 320px; z-index: 101;
      background: rgba(38,10,12,.96); border: 1px solid rgba(239,68,68,.55);
      border-radius: 10px; padding: 16px 20px;
      text-align: center; font-family: sans-serif; color: #ffd9d9;
      font-size: 13px; line-height: 1.45;
    }
    #error.hidden { display: none; }

    /* ── Popup ouvert : les panneaux custom (z-index 10) sont des frères de #viewDiv,
       ils peignent donc par-dessus le popup ancré en bas à droite. On les escamote
       le temps de la lecture ; ils reviennent à la fermeture. ── */
    body.popup-open #source { display: none; }

    /* ── Mobile : panneaux empilés, ils se recouvraient et masquaient deux KPI ── */
    @media (max-width: 640px) {
      #panel { top: 8px; left: 8px; right: 8px; min-width: 0; padding: 10px 12px; }
      #panel h1 { font-size: 14px; }
      #panel .sub { display: none; }
      .kpi { padding: 6px 8px; }
      .kpi .kv { font-size: 16px; }
      #controls { top: auto; bottom: 74px; left: 8px; right: 8px; min-width: 0; padding: 10px 12px; gap: 10px; }
      #source { bottom: 28px; left: 8px; right: 8px; }
      /* décale les widgets Esri pour qu'ils restent atteignables autour des panneaux */
      .esri-ui-top-left, .esri-ui-top-right { padding-top: 88px; }
      .esri-ui-bottom-left { padding-bottom: 190px; }
      /* en bas d'écran, les contrôles recouvriraient le popup ancré : on les escamote aussi */
      body.popup-open #controls { display: none; }
      body.popup-open .esri-ui-bottom-left { padding-bottom: 0; }
    }
  </style>
</head>
<body>
<div id="viewDiv" aria-label="Carte des séismes USGS"></div>
<div id="loading" role="status" aria-live="polite">⏳ Chargement des données USGS…</div>
<div id="error" class="hidden" role="alert"></div>

<!-- Info panel — top-left -->
<div id="panel">
  <h1>🌍 Séismes en temps réel</h1>
  <div class="sub">USGS Earthquake Hazards Program</div>
  <div class="kpis">
    <div class="kpi">
      <div class="kv" id="kv-count">–</div>
      <div class="kl">Total</div>
    </div>
    <div class="kpi red">
      <div class="kv" id="kv-max">–</div>
      <div class="kl">Mag. max</div>
    </div>
    <div class="kpi orange">
      <div class="kv" id="kv-sig">–</div>
      <div class="kl">M ≥ 5</div>
    </div>
  </div>
</div>

<!-- Controls — top-right -->
<div id="controls">
  <div>
    <label class="ctrl-label" for="periodSelect">Période de temps</label>
    <select class="ctrl-select" id="periodSelect">
      <option value="all_month">Dernier mois — Tous</option>
      <option value="all_week">Dernière semaine — Tous</option>
      <option value="all_day">Dernier jour — Tous</option>
      <option value="all_hour">Dernière heure — Tous</option>
      <option value="significant_month">Mois — Significatifs seulement</option>
      <option value="4.5_month">Mois — Magnitude ≥ 4.5</option>
      <option value="2.5_month">Mois — Magnitude ≥ 2.5</option>
    </select>
  </div>
  <div>
    <label class="ctrl-label" for="magSlider">
      Magnitude minimum
      <span id="magVal">0</span>
    </label>
    <input type="range" id="magSlider" min="0" max="8" step="0.5" value="0" disabled>
  </div>
</div>

<!-- Source credit + navigation — bottom-right -->
<div id="source">
  <div class="views">
    <a href="index.html" aria-current="page">Carte</a> ·
    <a href="earthquake_heatmap.html">Heatmap</a> ·
    <a href="earthquakes_last_month_3D.html">3D</a>
  </div>
  Données : <a href="https://earthquake.usgs.gov/earthquakes/feed/v1.0/geojson.php" target="_blank" rel="noopener noreferrer">USGS Real-time Feeds</a> · Actualisé automatiquement
</div>

<script>
require([
  "esri/Map",
  "esri/views/MapView",
  "esri/layers/GeoJSONLayer",
  "esri/widgets/Popup",
  "esri/widgets/Legend",
  "esri/widgets/Expand",
  "esri/widgets/Home",
  "esri/widgets/Search",
  "esri/core/reactiveUtils"
], function(Map, MapView, GeoJSONLayer, Popup, Legend, Expand, Home, Search, reactiveUtils) {

  const BASE = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/";

  /* ── Overlay de chargement et message d'erreur ── */
  function showLoading() { document.getElementById("loading").classList.remove("hidden"); }
  function hideLoading() { document.getElementById("loading").classList.add("hidden"); }
  function clearError()  { document.getElementById("error").classList.add("hidden"); }
  function showError(msg) {
    var el = document.getElementById("error");
    el.textContent = msg;
    el.classList.remove("hidden");
    hideLoading();
  }

  /* ── Renderer ── */
  const renderer = {
    type: "class-breaks",
    field: "mag",
    classBreakInfos: [
      {
        minValue: -10, maxValue: 1,
        symbol: { type: "simple-marker", color: [160,200,240,.60], outline: { color: [255,255,255,.2], width: .5 } },
        label: "< 1 — Microsismique"
      },
      {
        minValue: 1, maxValue: 2,
        symbol: { type: "simple-marker", color: [80,200,100,.70], outline: { color: [255,255,255,.25], width: .5 } },
        label: "1 – 2 — Mineur"
      },
      {
        minValue: 2, maxValue: 3,
        symbol: { type: "simple-marker", color: [240,210,0,.78], outline: { color: [255,255,255,.3], width: .5 } },
        label: "2 – 3 — Léger"
      },
      {
        minValue: 3, maxValue: 4,
        symbol: { type: "simple-marker", color: [255,135,0,.83], outline: { color: [255,255,255,.35], width: 1 } },
        label: "3 – 4 — Modéré"
      },
      {
        minValue: 4, maxValue: 5,
        symbol: { type: "simple-marker", color: [245,55,20,.88], outline: { color: [255,200,180,.5], width: 1 } },
        label: "4 – 5 — Fort"
      },
      {
        minValue: 5, maxValue: 6,
        symbol: { type: "simple-marker", color: [200,0,0,.92], outline: { color: [255,160,160,.65], width: 1.5 } },
        label: "5 – 6 — Majeur"
      },
      {
        minValue: 6, maxValue: 30,
        symbol: { type: "simple-marker", color: [90,0,0,.96], outline: { color: [255,80,80,.85], width: 2.5 } },
        label: "≥ 6 — Dévastateur"
      }
    ],
    visualVariables: [{
      type: "size",
      field: "mag",
      stops: [
        { value: 1, size: "3px"  },
        { value: 2, size: "7px"  },
        { value: 3, size: "12px" },
        { value: 4, size: "18px" },
        { value: 5, size: "30px" },
        { value: 6, size: "48px" },
        { value: 7, size: "70px" },
        { value: 8, size: "95px" }
      ]
    }]
  };

  /* ── Popup ──
     Le flux USGS n'expose pas de champ "depth" (la profondeur est le Z de la géométrie)
     et "time" est un entier epoch en millisecondes (inféré en double, donc dateFormat
     est ignoré) : les deux passent par Arcade, comme les valeurs anglaises à traduire. */
  const popupTemplate = {
    title: "{place}",
    // "url" n'est affiché dans aucun champ : sans outFields la couche ne le remonte pas
    // sur l'entité sélectionnée et l'action « Voir sur USGS » n'aurait rien à ouvrir.
    outFields: ["mag", "place", "time", "type", "status", "tsunami", "url"],
    expressionInfos: [
      {
        name: "profondeur",
        title: "📍 Profondeur",
        expression: "var g = Geometry($feature);\nvar z = IIf(IsEmpty(g), null, g.z);\nIIf(IsEmpty(z), 'n/d', Text(Round(z, 1)) + ' km')"
      },
      {
        name: "dateLisible",
        title: "📅 Date et heure",
        expression: "IIf(IsEmpty($feature.time), 'n/d', Text(Date($feature.time), 'DD/MM/Y HH:mm'))"
      },
      {
        name: "typeFr",
        title: "🔬 Type d'événement",
        expression: "Decode($feature.type, 'earthquake', 'Séisme', 'quarry blast', 'Tir de carrière', 'explosion', 'Explosion', 'mining explosion', 'Explosion minière', 'ice quake', 'Séisme glaciaire', $feature.type)"
      },
      {
        name: "statutFr",
        title: "✅ Statut USGS",
        expression: "Decode($feature.status, 'automatic', 'Automatique', 'reviewed', 'Validé par un analyste', 'deleted', 'Supprimé', $feature.status)"
      },
      {
        name: "tsunamiFr",
        title: "🌊 Alerte tsunami",
        expression: "IIf($feature.tsunami == 1, 'Oui', 'Non')"
      }
    ],
    content: [{
      type: "fields",
      fieldInfos: [
        { fieldName: "mag",                    label: "⚡ Magnitude", format: { places: 1 } },
        { fieldName: "expression/profondeur",  label: "📍 Profondeur"       },
        { fieldName: "expression/dateLisible", label: "📅 Date et heure"   },
        { fieldName: "expression/typeFr",      label: "🔬 Type d'événement" },
        { fieldName: "expression/statutFr",    label: "✅ Statut USGS"      },
        { fieldName: "expression/tsunamiFr",   label: "🌊 Alerte tsunami"   }
      ]
    }],
    actions: [{
      title: "Voir sur USGS",
      id: "usgs-link",
      icon: "link"   // "className" est déprécié depuis la 4.28
    }]
  };

  /* ── Layer factory ──
     Le rafraîchissement retélécharge le flux entier : les flux « mois » pèsent
     jusqu'à 8 Mo, on les rappelle donc bien moins souvent que les flux courts. */
  const REFRESH_MINUTES = { all_hour: 5, all_day: 5 };
  function makeLayer(period) {
    return new GeoJSONLayer({
      url: BASE + period + ".geojson",
      title: "Séismes USGS",
      copyright: "USGS Earthquake Hazards Program",
      renderer: renderer,
      popupTemplate: popupTemplate,
      orderBy: [{ field: "mag" }],
      refreshInterval: REFRESH_MINUTES[period] || 15   // minutes
    });
  }

  var currentLayer = makeLayer("all_month");

  const map = new Map({
    basemap: "dark-gray-vector",
    layers: [currentLayer]
  });

  const view = new MapView({
    container: "viewDiv",
    map: map,
    zoom: 3,
    center: [10, 20],
    constraints: { rotationEnabled: false },
    // En 4.30 l'objet littéral n'est plus autocasté en widget : on instancie le Popup
    popup: new Popup({
      dockEnabled: true,
      dockOptions: { position: "bottom-right", breakpoint: false }
    })
  });

  /* ── KPI calculés sur la couche déjà chargée (plus de second téléchargement) ── */
  function setKpi(count, maxMag, sig) {
    document.getElementById("kv-count").textContent = count;
    document.getElementById("kv-max").textContent   = maxMag;
    document.getElementById("kv-sig").textContent   = sig;
  }

  var statsToken = 0;
  function updateStats(layer, where) {
    var token = ++statsToken;
    var base = where || "1=1";
    var sigWhere = base === "1=1" ? "mag >= 5" : "(" + base + ") AND mag >= 5";
    return layer.when()
      .then(function() {
        return Promise.all([
          layer.queryFeatureCount({ where: base }),
          layer.queryFeatures({
            where: base,
            returnGeometry: false,
            outStatistics: [{ statisticType: "max", onStatisticField: "mag", outStatisticFieldName: "magmax" }]
          }),
          layer.queryFeatureCount({ where: sigWhere })
        ]);
      })
      .then(function(res) {
        if (token !== statsToken) { return; }   // réponse obsolète (période changée entre-temps)
        var feats  = res[1] && res[1].features ? res[1].features : [];
        var attrs  = feats.length ? feats[0].attributes : null;
        var maxMag = "–";
        if (attrs) {
          var vals = Object.keys(attrs).map(function(k) { return attrs[k]; });
          if (vals.length && vals[0] !== null && vals[0] !== undefined) {
            maxMag = Number(vals[0]).toFixed(1);
          }
        }
        setKpi(res[0].toLocaleString("fr-FR"), maxMag, res[2].toLocaleString("fr-FR"));
        clearError();
        hideLoading();
      })
      .catch(function() {
        if (token !== statsToken) { return; }
        setKpi("–", "–", "–");
        showError("Données USGS momentanément indisponibles. Réessayez dans quelques minutes.");
      });
  }

  /* ── LayerView hook (filtre slider) ── */
  var layerView = null;
  var magFilter = 0;
  var slider = document.getElementById("magSlider");

  function currentWhere() {
    return magFilter > 0 ? "mag >= " + magFilter : "1=1";
  }
  function applyFilter() {
    if (!layerView) { return; }
    layerView.filter = magFilter > 0 ? { where: "mag >= " + magFilter } : null;
  }
  function hookLayerView(layer) {
    view.whenLayerView(layer).then(function(lv) {
      layerView = lv;
      slider.disabled = false;
      applyFilter();   // réapplique la valeur choisie pendant le chargement de la couche
    }).catch(function() {
      // l'échec de la couche est déjà signalé par updateStats()
    });
  }
  var refreshHandle = null;
  function hookRefresh(layer) {
    refreshHandle = layer.on("refresh", function() {
      if (layer !== currentLayer) { return; }   // couche d'une période abandonnée
      updateStats(layer, currentWhere());
    });
  }

  hookLayerView(currentLayer);
  hookRefresh(currentLayer);
  updateStats(currentLayer, "1=1");

  /* ── Magnitude slider ── */
  slider.addEventListener("input", function() {
    magFilter = parseFloat(this.value);
    document.getElementById("magVal").textContent = magFilter.toFixed(1);
    applyFilter();
  });
  // KPI recalculés en fin de geste, pour qu'ils décrivent bien ce que montre la carte
  slider.addEventListener("change", function() {
    updateStats(currentLayer, currentWhere());
  });

  /* ── Period selector ── */
  document.getElementById("periodSelect").addEventListener("change", function() {
    slider.value = 0;
    slider.disabled = true;
    magFilter = 0;
    document.getElementById("magVal").textContent = "0";
    showLoading();
    clearError();
    setKpi("–", "–", "–");
    layerView = null;

    // on coupe le rafraîchissement de l'ancienne couche : sinon elle continue
    // de retélécharger son flux et d'écraser les KPI de la nouvelle période
    if (refreshHandle) { refreshHandle.remove(); refreshHandle = null; }
    currentLayer.refreshInterval = 0;

    var period = this.value;
    var newLayer = makeLayer(period);
    map.layers.removeAll();
    map.add(newLayer);
    currentLayer = newLayer;
    hookLayerView(newLayer);
    hookRefresh(newLayer);
    updateStats(newLayer, "1=1");
  });

  /* ── Widgets ArcGIS (home, légende, recherche) ── */
  view.when(function() {
    view.ui.add(new Home({ view: view }), { position: "top-left", index: 1 });

    var legend = new Legend({ view: view, style: { type: "card", layout: "stack" } });
    view.ui.add(
      new Expand({ view: view, content: legend, expanded: false, expandTooltip: "Légende" }),
      "bottom-left"
    );

    // Recherche repliée dans un Expand : à découvert elle passerait sous le panneau de contrôles
    view.ui.add(
      new Expand({
        view: view,
        content: new Search({ view: view }),
        expandIcon: "search",
        expandTooltip: "Rechercher un lieu"
      }),
      { position: "top-left", index: 2 }
    );

    if (view.popup && typeof view.popup.on === "function") {
      view.popup.on("trigger-action", function(e) {
        if (e.action.id === "usgs-link") {
          var feat = view.popup.selectedFeature;
          var url  = feat && feat.attributes ? feat.attributes.url : null;
          if (url) { window.open(url, "_blank", "noopener"); }
        }
      });
    }

    // Le popup est ancré en bas à droite, là où se trouvent #source (et #controls
    // sur mobile) : on masque ces blocs tant qu'il est ouvert, sinon ils le recouvrent.
    reactiveUtils.watch(
      function() { return !!(view.popup && view.popup.visible); },
      function(open) { document.body.classList.toggle("popup-open", open); },
      { initial: true }
    );
  }, function() {
    showError("La carte n'a pas pu être initialisée dans ce navigateur.");
  });

});
</script>
</body>
</html>
