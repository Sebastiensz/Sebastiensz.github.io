<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Incidents routiers en Europe - Carte interactive</title>
    <meta name="description" content="Carte interactive des incidents routiers en Europe : accidents, travaux, routes barrées, filtrables par type et par année.">

    <link rel="stylesheet" href="https://js.arcgis.com/4.15/esri/css/main.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://js.arcgis.com/4.15/"></script>
    <script src="./script.js" defer></script>

</head>

<body>
    <div id="viewDiv">
        <div id="titleDiv" class="esri-widget">
            Liste des incidents de la route - Europe
        </div>
        <div id="formDiv" class="esri-widget">
            <div id="filter" role="group" aria-label="Filtres des incidents">
                <label for="filter-type">Type d'incidents :</label>
                <select id="filter-type" class="esri-select">
                    <option value="">Tous</option>
                    <option value="CONSTRUCTION">Construction</option>
                    <option value="ROAD_CLOSURE">Route barrée</option>
                    <option value="MISCELLANEOUS">Divers</option>
                    <option value="ROADHAZARD">Route dangereuse</option>
                    <option value="LANE_RESTRICTION">Restriction de voie</option>
                    <option value="ACCIDENT">Accident</option>
                    <option value="CONGESTION">Embouteillage</option>
                    <option value="DISABLEDVEHICLE">Véhicule en panne</option>
                    <option value="PLANNED EVENT">Événement planifié</option>
                    <option value="OTHER NEWS">Autres informations</option>
                </select>
                <label for="filter-date">Année :</label>
                <select id="filter-date" class="esri-select">
                    <option value="">Toutes</option>
                    <option value="2020">2020</option>
                    <option value="2019">2019</option>
                    <option value="2018">2018</option>
                    <option value="2017">2017</option>
                    <option value="2016">2016</option>
                    <option value="2015">2015</option>
                </select>
            </div>
            <button id="cluster" class="esri-button" aria-pressed="false">Activer regroupement</button>
        </div>
    </div>

    <!-- Indicateur d'attente, masqué dès que la vue cartographique est prête -->
    <div id="loading" role="status" aria-live="polite">
        <span class="loading-spinner" aria-hidden="true"></span>
        Chargement de la carte...
    </div>

    <!-- Message affiché si la couche d'incidents ne peut pas être chargée -->
    <div id="dataError" class="esri-widget" role="alert" hidden></div>
</body>

</html>
