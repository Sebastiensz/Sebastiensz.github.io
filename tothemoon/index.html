<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
  ArcGIS API for JavaScript, https://js.arcgis.com
  For more information about the import-gltf sample, read the original sample description at developers.arcgis.com.
  https://developers.arcgis.com/javascript/latest/sample-code/import-gltf/index.html
  -->
<title>To the Moon - Modèle 3D glTF</title>
    <meta
      name="description"
      content="Scène 3D ArcGIS : placez des modèles glTF (fusée, canoë) dans la scène."
    />
    <meta property="og:title" content="To the Moon - Modèle 3D glTF" />
    <meta
      property="og:description"
      content="Scène 3D ArcGIS : placez des modèles glTF (fusée, canoë) dans la scène."
    />

    <link
      rel="stylesheet"
      href="https://js.arcgis.com/4.13/esri/themes/light/main.css"
    />
    <script src="https://js.arcgis.com/4.13/"></script>

    <style>
      html,
      body,
      #viewDiv {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
      }

      #paneDiv {
        padding: 10px;
        max-width: 200px;
        background-color: rgba(255, 255, 255, 0.8);
        font-size: 1.1em;
      }

      #status {
        font-size: 0.8em;
        line-height: 1.2em;
        margin: 8px 0 0;
        min-height: 1.2em;
      }

      #status.status--error {
        color: #a02020;
      }

      #credits {
        font-size: 0.8em;
        line-height: 1.2em;
      }

      /* Écran d'attente : la scène 3D met plusieurs secondes à s'afficher. */
      #loading {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 24px;
        background-color: #ffffff;
        color: #323232;
        font-family: "Avenir Next W00", "Helvetica Neue", Helvetica, Arial,
          sans-serif;
        font-size: 1.1em;
        text-align: center;
      }

      #loading.is-hidden {
        display: none;
      }

      #loading.loading--error {
        color: #a02020;
      }
    </style>
    <script>
      require([
        "esri/views/SceneView",
        "esri/WebScene",
        "esri/layers/GraphicsLayer",
        "esri/widgets/Sketch/SketchViewModel"
      ], function(SceneView, WebScene, GraphicsLayer, SketchViewModel) {
        // Modèles glTF servis par le dépôt, en chemin relatif à cette page.
        // Les anciennes URL distantes (dépôt GitHub supprimé, échantillon Esri
        // retiré) renvoyaient 404 : aucun modèle ne s'affichait après un clic.
        const ROCKET_MODEL = "./scene.gltf";
        const CANOE_MODEL = "./canoe.glb";

        // load web scene from ArcGIS Online
        const webScene = new WebScene({
          portalItem: {
            // autocasts as new PortalItem()
            id: "414a28cfca7a471180e8e952cf14c60f"
          }
        });

        const view = new SceneView({
          container: "viewDiv",
          map: webScene
        });

        const graphicsLayer = new GraphicsLayer();
        view.map.add(graphicsLayer);

        const rocketBtn = document.getElementById("rocket");
        const canoeBtn = document.getElementById("canoe");
        const clearBtn = document.getElementById("clear");
        const statusDiv = document.getElementById("status");
        const loadingDiv = document.getElementById("loading");

        function setStatus(message, isError) {
          statusDiv.textContent = message;
          statusDiv.classList.toggle("status--error", isError === true);
        }

        // Vérifie que le modèle est bien servi. S'il ne l'est pas, le bouton
        // est désactivé et l'utilisateur prévenu, au lieu d'un point placé
        // dans la scène sans aucun objet visible dedans.
        function checkModel(button, href, label) {
          // cache: "no-store" pour interroger réellement le serveur : une
          // réponse gardée en cache masquerait un fichier devenu introuvable.
          fetch(href, { method: "HEAD", cache: "no-store" })
            .then(function(response) {
              // 405 : le serveur refuse HEAD, on ne peut rien en conclure.
              if (!response.ok && response.status !== 405) {
                throw new Error("HTTP " + response.status);
              }
            })
            .catch(function(error) {
              console.error("Modèle 3D indisponible : " + href, error);
              button.disabled = true;
              button.classList.add("esri-button--disabled");
              button.title = "Modèle indisponible : " + href;
              setStatus("Modèle « " + label + " » indisponible.", true);
            });
        }

        function deactivateButtons() {
          const elements = Array.prototype.slice.call(
            document.getElementsByClassName("esri-button")
          );
          elements.forEach(function(element) {
            element.classList.remove("esri-button--secondary");
            if (element.hasAttribute("aria-pressed")) {
              element.setAttribute("aria-pressed", "false");
            }
          });
        }

        view
          .when(function() {
            loadingDiv.classList.add("is-hidden");

            // This sample uses the SketchViewModel to add points to a
            // GraphicsLayer. The points have 3D glTF models as symbols.
            const sketchVM = new SketchViewModel({
              layer: graphicsLayer,
              view: view
            });

            // Hauteur explicite (en mètres) pour les deux modèles : sans elle,
            // le canoë s'affichait à son échelle native (~0,18 m de haut),
            // sans rapport avec la fusée.
            function activateModel(button, href, height, label) {
              deactivateButtons();
              sketchVM.pointSymbol = {
                type: "point-3d",
                symbolLayers: [
                  {
                    type: "object",
                    height: height,
                    resource: {
                      href: href
                    }
                  }
                ]
              };
              sketchVM.create("point");
              button.classList.add("esri-button--secondary");
              button.setAttribute("aria-pressed", "true");
              setStatus(
                "Cliquez dans la scène pour placer « " +
                  label +
                  " » (Échap pour annuler)."
              );
            }

            rocketBtn.addEventListener("click", function() {
              activateModel(rocketBtn, ROCKET_MODEL, 10, "Fusée");
            });

            canoeBtn.addEventListener("click", function() {
              activateModel(canoeBtn, CANOE_MODEL, 1, "Canoë");
            });

            clearBtn.addEventListener("click", function() {
              sketchVM.cancel();
              graphicsLayer.removeAll();
              deactivateButtons();
              setStatus("Scène effacée.");
            });

            sketchVM.on("create", function(event) {
              if (event.state === "complete") {
                sketchVM.update(event.graphic);
                deactivateButtons();
                setStatus(
                  "Modèle placé. Choisissez un modèle pour en ajouter un autre."
                );
              } else if (event.state === "cancel") {
                deactivateButtons();
                setStatus("");
              }
            });

            checkModel(rocketBtn, ROCKET_MODEL, "Fusée");
            checkModel(canoeBtn, CANOE_MODEL, "Canoë");
          })
          .catch(function(error) {
            console.error(error);
            loadingDiv.classList.add("loading--error");
            loadingDiv.textContent =
              "Impossible d'afficher la scène 3D. Votre navigateur ou votre carte graphique ne supporte peut-être pas WebGL.";
          });

        // Filet de sécurité : si la scène n'est jamais prête (réseau coupé,
        // CDN inaccessible), l'écran d'attente laisse place à un message.
        setTimeout(function() {
          if (
            !loadingDiv.classList.contains("is-hidden") &&
            !loadingDiv.classList.contains("loading--error")
          ) {
            loadingDiv.classList.add("loading--error");
            loadingDiv.textContent =
              "La scène 3D met un temps inhabituel à se charger. Vérifiez votre connexion, puis rechargez la page.";
          }
        }, 30000);

        view.ui.add("paneDiv", "top-right");
      });
    </script>
  </head>

  <body>
    <div id="viewDiv"></div>
    <div
      id="paneDiv"
      class="esri-widget"
      role="group"
      aria-label="Sélection du modèle 3D à placer"
    >
      <p>Choisissez un modèle 3D et placez-le dans la scène&nbsp;:</p>
      <button id="rocket" type="button" class="esri-button" aria-pressed="false">
        Fusée
      </button
      ><br />
      <button id="canoe" type="button" class="esri-button" aria-pressed="false">
        Canoë
      </button
      ><br />
      <button id="clear" type="button" class="esri-button esri-button--tertiary">
        Effacer
      </button>
      <p id="status" role="status" aria-live="polite"></p>
      <p id="credits">
        Fusée «&nbsp;Cohete de Tin Tin&nbsp;» par
        <a
          href="https://sketchfab.com/CamiloFlores"
          target="_blank"
          rel="noopener noreferrer"
          >CamiloFlores</a
        >
        (Sketchfab), sous
        <a
          href="https://creativecommons.org/licenses/by/4.0/"
          target="_blank"
          rel="noopener noreferrer"
          >CC BY 4.0</a
        >. Canoë des
        <a
          href="https://www.kenney.nl/assets/"
          target="_blank"
          rel="noopener noreferrer"
          >Kenney game assets</a
        >, sous
        <a
          href="https://creativecommons.org/publicdomain/zero/1.0/"
          target="_blank"
          rel="noopener noreferrer"
          >CC0 1.0</a
        >. Scène 3D&nbsp;: échantillon Esri «&nbsp;Import glTF sample&nbsp;»
        (Alaska).
      </p>
    </div>
    <div id="loading" role="status" aria-live="polite">
      Chargement de la scène 3D…
    </div>
  </body>
</html>
